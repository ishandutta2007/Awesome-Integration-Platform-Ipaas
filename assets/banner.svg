<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beaconRing {
        0% { r: 6px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 8 12;
        animation: dashFlow 4s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 6 10;
        animation: dashFlow 5s linear infinite reverse;
      }
      .floating-banner {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .beacon {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowPurple)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowCyan)"/>

  <!-- Subtle Grid Pattern in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Dynamic / Animated Background Integration Flow Lines (Strictly behind text) -->
  <g opacity="0.45">
    <!-- Top Circuit Flow -->
    <path class="flow-path" d="M 60 70 L 260 70 L 330 110 L 870 110 L 940 70 L 1140 70" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <!-- Bottom Circuit Flow -->
    <path class="flow-path-reverse" d="M 60 290 L 220 290 L 300 250 L 900 250 L 980 290 L 1140 290" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <!-- Curved interconnects -->
    <path class="flow-path" d="M 160 300 C 180 200, 220 160, 260 70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <path class="flow-path-reverse" d="M 1040 60 C 1020 160, 980 200, 940 290" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- Animated Glowing Nodes / Beacons in Corners (Non-intrusive) -->
  <g>
    <!-- Left Integration Hub Node -->
    <circle cx="160" cy="180" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <circle class="beacon" cx="160" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle class="node-pulse" cx="160" cy="180" r="6" fill="#38bdf8"/>

    <!-- Left Small Connectors -->
    <circle cx="90" cy="110" r="4" fill="#818cf8"/>
    <line x1="90" y1="110" x2="160" y2="180" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="80" cy="240" r="4" fill="#38bdf8"/>
    <line x1="80" y1="240" x2="160" y2="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Right Integration Hub Node -->
    <circle cx="1040" cy="180" r="18" fill="#1e293b" stroke="#c084fc" stroke-width="2" opacity="0.8"/>
    <circle class="beacon" cx="1040" cy="180" r="8" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle class="node-pulse" cx="1040" cy="180" r="6" fill="#c084fc"/>

    <!-- Right Small Connectors -->
    <circle cx="1110" cy="110" r="4" fill="#c084fc"/>
    <line x1="1110" y1="110" x2="1040" y2="180" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1120" cy="240" r="4" fill="#38bdf8"/>
    <line x1="1120" y1="240" x2="1040" y2="180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Foreground Content (Solid, legible, highly visible) -->
  <!-- Category Pill Badge at Top Center -->
  <g transform="translate(480, 48)">
    <rect width="240" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="20" cy="15" r="4" fill="#10b981"/>
    <text x="35" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#neonGlow)">
    AWESOME iPaaS &amp; INTEGRATION PLATFORMS
  </text>
  <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    AWESOME iPaaS &amp; INTEGRATION PLATFORMS
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise Integration • Workflow Automation • API Connectors • Sovereign Self-Hosted
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(195, 230)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Workflow Automation</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="90" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏢 Enterprise iPaaS</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="195" height="42" rx="21" fill="url(#badgeGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="97" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔌 API-Led Connectivity</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(615, 0)">
      <rect width="195" height="42" rx="21" fill="url(#badgeGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="97" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Self-Hosted Sovereignty</text>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
